name: Coletar dados do hipismo (FPH)

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3).
    - cron: "17 12,17,21,0 * * *"               # coleta completa: 9h, 14h, 18h e 21h em Brasília
    - cron: "17 1-11,13-16,18-20,22,23 * * *"   # coleta rápida nas demais horas: só torneios em andamento
  workflow_dispatch:          # botão "Run workflow" pra rodar na hora

permissions:
  contents: write
  pages: write

concurrency:
  group: coleta-hipica
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        working-directory: scripts/hipica
        run: npm install --no-audit --no-fund

      - name: Coletar calendário e resultados
        working-directory: scripts/hipica
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          MODO: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 12,17,21,0 * * *') && 'completo' || 'rapido' }}
        run: node coletar.mjs

      - name: Salvar dados no repositório
        id: salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hipica
          if git diff --cached --quiet; then
            echo "Nenhuma novidade desta vez."
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Atualiza dados do hipismo"
            git push
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar no GitHub Pages
        if: steps.salvar.outputs.mudou == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "O Pages vai publicar no próximo ciclo."
